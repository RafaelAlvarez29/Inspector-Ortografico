<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inspector Ortográfico</title>
  <link rel="stylesheet" href="fonts/inter.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="configuracion.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icon48.png" alt="Icono" class="logo">
      <h1>Inspector Ortográfico</h1>
      <button id="opciones" class="icono-btn" title="Opciones: idioma de revisión y diccionario personal" aria-label="Opciones: idioma de revisión y diccionario personal">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </button>
    </header>

    <div class="carril-marco">
      <div class="carril" id="carril">
      <section class="vista" id="vistaPrincipal">
      <div class="actions">
        <button id="revisar" class="button button-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.589 3.588A2.4 2.4 0 0 1 20 8v3.25"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="m21 22-2.88-2.88"/><circle cx="16" cy="17" r="3"/></svg>
          <span>Revisar Página</span>
        </button>
      
        <button id="limpiar" class="button button-secondary" title="Limpiar resaltado y resultados">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          <span>Limpiar</span>
        </button>
      </div>

      <div class="actions" id="accionesExportar" style="display: none;">
          <button id="exportar" class="button button-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Exportar CSV</span>
          </button>
      </div>


      <hr class="divider">

      <div id="filtros" class="filtros" hidden></div>

      <div id="progreso" class="progreso" hidden role="progressbar"
           aria-valuemin="0" aria-valuemax="100" aria-label="Progreso de la revisión">
        <div id="progresoBarra" class="progreso-barra"></div>
      </div>

      <div id="status" class="status-message"><!-- El estado lo pinta popup.js --></div>
      <div id="deshacer" class="deshacer" hidden>
        <span id="deshacerTexto"></span>
        <button type="button" id="deshacerBtn">Deshacer</button>
      </div>

      <div id="listaErrores" class="error-list">
        <!-- El contenido de los errores se generará aquí con JavaScript -->
      </div>

      <div id="idiomaActivo" class="idioma-activo" title="Idioma de revisión. Se cambia en Opciones."></div>
      </section>

      <section class="vista" id="vistaConfig" inert aria-hidden="true">
        <div class="subcabecera">
          <button type="button" id="volver" class="icono-btn icono-btn-claro" aria-label="Volver a la revisión">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </button>
          <h2>Configuración</h2>
        </div>
        <div id="config"></div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
